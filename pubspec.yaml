name: eq_app
description: Enjoy the power of hype muzik
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.25

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0
  just_audio: ^0.10.4
 
  provider: ^6.0.5
  sleek_circular_slider: ^2.0.1
  flutter_native_splash: ^2.3.2
  flutter_launcher_icons: ^0.14.4

  permission_handler: ^13.0.1
  shared_preferences: ^2.2.1
  flutter_bloc: ^9.1.1
  audio_service: ^0.18.15
  animations: ^3.0.0
  tutorial_coach_mark: ^1.2.9
  http: ^1.1.0
  crypto: ^3.0.3
  google_sign_in: ^7.2.0
  google_sign_in_platform_interface: ^3.1.0
  flutter_secure_storage: ^11.0.0
  flutter_appauth: ^12.0.0
  firebase_analytics: ^12.0.3
  firebase_crashlytics: ^5.0.3
  firebase_core: ^4.2.0
  path_provider: ^2.1.1
  ffi: ^2.1.0
  mobile_scanner: ^7.2.0
  wiredash: ^2.1.2
  flutter_shaders: ^0.1.3
  swipable_stack: ^2.0.0
  on_audio_query:
    path: plugins/on_audio_query
  flutter_zoom_drawer: ^3.2.0
  id3tag: ^0.2.0
  vector_math: ^2.2.0
  file_picker: ^13.1.0
  connectivity_plus: ^7.0.0
  dio: ^5.9.2
  dartz: ^0.10.1
  cached_network_image: ^4.0.4

  # Music video is played by this app's own player, not a plugin — see
  # `packages/just_audio/lib/video.dart`. A second player cannot share the
  # output, the DSP chain, the queue or the background service with the first,
  # and every video bug this app had was a consequence of there being two.

  # Local music-library database (drift/SQLite). Source of truth for the
  # browsing UI so cold-open renders instantly and the background scanner only
  # diffs MediaStore instead of re-querying the whole library every launch.
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.0

  # Phone Link — stream this phone's library to the desktop app over the LAN.
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  bonsoir: ^7.1.4
  # Keeps the sharing server alive in a foreground service (persistent
  # notification) even after the app is swiped from recents (Android).
  flutter_foreground_task: ^11.0.1

  # Hype Connect — a browser picks this phone as the player and drives it over
  # a WebSocket to the HypeMuzik backend. See `lib/services/connect/`. All five
  # were already in the lockfile as transitive dependencies; they are listed
  # here because this app now imports them directly.
  web_socket_channel: ^3.0.3
  uuid: ^4.5.1
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  clock: ^1.1.2
  firebase_messaging: ^16.7.1
  url_launcher: ^6.3.3


dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  # Drives the Hype Connect client's backoff, debounce and heartbeat timers in
  # tests without waiting for them.
  fake_async: ^1.3.3

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of yourclear

  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Codegen for the drift library database.
  drift_dev: ^2.28.0
  build_runner: ^2.5.0

dependency_overrides:
  just_audio:
    path: packages/just_audio

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/milkdrop_presets/

  # Brand typefaces, mirroring the web app (Fontshare, ITF Free Font License;
  # see assets/fonts/LICENSE-fontshare.txt). Satoshi is the app-wide default,
  # Clash Display is for titles. Clash ships only 500/600.
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Regular.ttf
          weight: 400
        - asset: assets/fonts/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi-Bold.ttf
          weight: 700
    - family: ClashDisplay
      fonts:
        - asset: assets/fonts/ClashDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/ClashDisplay-Semibold.ttf
          weight: 600
  # No `shaders:` section: the experimental GLSL sources (shaders/sea.frag and
  # assets/shaders/*.frag) are unused, and sea.frag currently fails to compile
  # (uniform buffer exceeds the max). To re-enable a runtime shader later, fix
  # it and add a `shaders:` entry pointing at a file OUTSIDE assets/ (so it isn't
  # also bundled as an asset).
  #   - images/a_dot_ham.jpeg
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
flutter_native_splash:
  color: "#000000"
  #background_image: "assets/background.png"
  image: assets/icon.png

  # Android 12 handles the splash screen differently than previous versions.  Please visit
  # https://developer.android.com/guide/topics/ui/splash-screen
  # Following are Android 12 specific parameter.
  android_12:
    # The image parameter sets the splash screen icon image.  If this parameter is not specified,
    # the app's launcher icon will be used instead.
    # Please note that the splash screen will be clipped to a circle on the center of the screen.
    # App icon with an icon background: This should be 960×960 pixels, and fit within a circle
    # 640 pixels in diameter.
    # App icon without an icon background: This should be 1152×1152 pixels, and fit within a circle
    # 768 pixels in diameter.
    # image: assets/icon.png

    # Splash screen background color.
    color: "#000000"

    # App icon background color.
    icon_background_color: "#000000"

    # The branding property allows you to specify an image used as branding in the splash screen.
    #branding: assets/dart.png

    # The image_dark, color_dark, icon_background_color_dark, and branding_dark set values that
    # apply when the device is in dark mode. If they are not specified, the app will use the
    # parameters from above.
    #image_dark: assets/android12splash-invert.png
    #color_dark: "#042a49"
    #icon_background_color_dark: "#eeeeee"

  # The android, ios and web parameters can be used to disable generating a splash screen on a given
  # platform.
  #android: false
  #ios: false
  #web: false

  # Platform specific images can be specified with the following parameters, which will override
  # the respective parameter.  You may specify all, selected, or none of these parameters:
  #color_android: "#42a5f5"
  #color_dark_android: "#042a49"
  #color_ios: "#42a5f5"
  #color_dark_ios: "#042a49"
  #color_web: "#42a5f5"
  #color_dark_web: "#042a49"

  # android_gravity can be one of the following Android Gravity (see
  # https://developer.android.com/reference/android/view/Gravity): bottom, center,
  # center_horizontal, center_vertical, clip_horizontal, clip_vertical, end, fill, fill_horizontal,
  # fill_vertical, left, right, start, or top.
  android_gravity: center
  #
  # ios_content_mode can be one of the following iOS UIView.ContentMode (see
  # https://developer.apple.com/documentation/uikit/uiview/contentmode): scaleToFill,
  # scaleAspectFit, scaleAspectFill, center, top, bottom, left, right, topLeft, topRight,
  # bottomLeft, or bottomRight.
  #ios_content_mode: center
  #

  fullscreen: true
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
